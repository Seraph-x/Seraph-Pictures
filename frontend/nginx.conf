server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 120m;

  # Preserve the published host port in directory redirects.
  absolute_redirect off;

  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /upload {
    # Keep Docker/self-hosted navigation aligned with Cloudflare Pages:
    # GET /upload renders the Chinese single-page UI, while POST /upload
    # remains the upload API endpoint.
    if ($request_method = GET) {
      rewrite ^ /index.html last;
    }
    if ($request_method = HEAD) {
      rewrite ^ /index.html last;
    }

    proxy_pass http://api:8787/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /file/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /share/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  error_page 404 /404.html;

  location / {
    # Clean URLs like /gallery or /admin resolve to /gallery.html etc., matching
    # how Cloudflare Pages serves the legacy pages. Retired and unknown paths
    # return 404 instead of rendering a different interface.
    try_files $uri $uri.html $uri/ =404;
  }
}
